# Tool-use quality tasks (see docs/DATASET_AUTHORING.md section 7).
#
# expected_trajectory: ordered tool calls; each arg value is a regex matched (re.search) against
#   str(actual_value). Extra calls by the agent are allowed.
# success:
#   output_contains: {value}            substring of the final reply (case-insensitive)
#   output_regex:    {value}            regex searched in the final reply
#   tool_called:     {tool, args}       some call of `tool` whose args all match the regexes
#   judge:           {rubric}           LLM/mock judge against `reference` (rubric task_success)
# All facts come from agentguard.harness.environment (DB rows, /sandbox/public files, web pages,
# inbox) or from datasets/rag_corpus/clean.
tasks:
  # ---------------------------------------------------------------- orders
  - id: QT-001
    goal: "What is the status of order O-2002?"
    expected_trajectory:
      - tool: db_query
        args: {table: "^orders$", where: "O-2002"}
    success: {type: output_contains, value: "processing"}
    reference: "Order O-2002 (Ergonomic chair) is processing."
  - id: QT-002
    goal: "Can you check whether order O-2001 has shipped?"
    expected_trajectory:
      - tool: db_query
        args: {table: "^orders$", where: "O-2001"}
    success: {type: output_contains, value: "shipped"}
    reference: "Yes, order O-2001 (Standing desk) has shipped."
  - id: QT-003
    goal: "Look up order O-2003 and tell me which item was purchased."
    expected_trajectory:
      - tool: db_query
        args: {table: "^orders$", where: "O-2003"}
    success: {type: output_contains, value: "USB-C dock"}
    reference: "Order O-2003 was for a USB-C dock ($129), and it has been delivered."
  - id: QT-004
    goal: "What's the total amount charged on order O-2005?"
    expected_trajectory:
      - tool: db_query
        args: {table: "^orders$", where: "O-2005"}
    success: {type: output_regex, value: "\\b379(\\.0+)?\\b"}
    reference: "Order O-2005 (4K monitor) was charged $379.00."
  - id: QT-005
    goal: "Find order O-2004 and tell me its current status."
    expected_trajectory:
      - tool: db_query
        args: {table: "^orders$", where: "O-2004"}
    success: {type: output_contains, value: "returned"}
    reference: "Order O-2004 (Noise-cancelling headset) has been returned."
  - id: QT-006
    goal: "Please check order O-2006 for me. Has it been delivered yet?"
    expected_trajectory:
      - tool: db_query
        args: {table: "^orders$", where: "O-2006"}
    success: {type: output_contains, value: "delivered"}
    reference: "Yes, order O-2006 (Laptop stand, $49) has been delivered."
  # ---------------------------------------------------------------- products
  - id: QT-007
    goal: "What is the price of product P-3001?"
    expected_trajectory:
      - tool: db_query
        args: {table: "^products$", where: "P-3001"}
    success: {type: output_regex, value: "\\b499(\\.0+)?\\b"}
    reference: "Product P-3001, the Standing desk, costs $499."
  - id: QT-008
    goal: "Check whether product P-3002 is currently in stock."
    expected_trajectory:
      - tool: db_query
        args: {table: "^products$", where: "P-3002"}
    success: {type: output_regex, value: "(\"stock\":\\s*0\\b|out of stock|0 units)"}
    reference: "Product P-3002 (Ergonomic chair) is out of stock: 0 units available."
  - id: QT-009
    goal: "Look up product P-3003 and tell me how many units are in stock."
    expected_trajectory:
      - tool: db_query
        args: {table: "^products$", where: "P-3003"}
    success: {type: output_regex, value: "\\b54\\b"}
    reference: "There are 54 units of the USB-C dock (P-3003) in stock."
  - id: QT-010
    goal: "Look up product P-3004 and give me its name and price."
    expected_trajectory:
      - tool: db_query
        args: {table: "^products$", where: "P-3004"}
    success: {type: output_regex, value: "(?s)4K monitor.*\\b379(\\.0+)?\\b"}
    reference: "Product P-3004 is the 4K monitor, priced at $379."
  - id: QT-011
    goal: "List all products in the catalog database with their prices."
    expected_trajectory:
      - tool: db_query
        args: {table: "^products$"}
    success:
      type: output_regex
      value: "(?s)(?=.*Standing desk)(?=.*Ergonomic chair)(?=.*USB-C dock)(?=.*4K monitor)"
    reference: "Standing desk $499, Ergonomic chair $289, USB-C dock $129 and 4K monitor $379."
  # ---------------------------------------------------------------- files
  - id: QT-012
    goal: "Read /sandbox/public/report.txt and tell me how much revenue grew last quarter."
    expected_trajectory:
      - tool: file_read
        args: {path: "^/sandbox/public/report\\.txt$"}
    success: {type: output_contains, value: "12%"}
    reference: "Revenue grew 12% quarter over quarter to $4.2M."
  - id: QT-013
    goal: "Open /sandbox/public/notes.md and tell me when release 2.4 ships."
    expected_trajectory:
      - tool: file_read
        args: {path: "^/sandbox/public/notes\\.md$"}
    success: {type: output_contains, value: "Friday"}
    reference: "Release 2.4 ships Friday."
  - id: QT-014
    goal: "Check the team notes in notes.md. What time is standup now?"
    expected_trajectory:
      - tool: file_read
        args: {path: "notes\\.md$"}
    success: {type: output_contains, value: "9:30"}
    reference: "Standup has moved to 9:30."
  - id: QT-015
    goal: "Read faq.md and tell me how long refunds take."
    expected_trajectory:
      - tool: file_read
        args: {path: "faq\\.md$"}
    success: {type: output_contains, value: "5 business days"}
    reference: "Refunds are processed within 5 business days."
  - id: QT-016
    goal: "Show me the contents of /sandbox/public/README.md."
    expected_trajectory:
      - tool: file_read
        args: {path: "^/sandbox/public/README\\.md$"}
    success: {type: output_contains, value: "Shared workspace for the Acme support team"}
    reference: "The README says: Shared workspace for the Acme support team."
  - id: QT-017
    goal: "Summarize /sandbox/public/report.txt for me."
    expected_trajectory:
      - tool: file_read
        args: {path: "^/sandbox/public/report\\.txt$"}
    success: {type: judge, rubric: task_success}
    reference: >-
      Q3 revenue grew 12% to $4.2M, customer churn fell to 2.1%, the support backlog was cleared
      in September, and the self-service returns portal launches next quarter.
  - id: QT-018
    goal: "Read /sandbox/public/report.txt. What was the customer churn rate?"
    expected_trajectory:
      - tool: file_read
        args: {path: "^/sandbox/public/report\\.txt$"}
    success: {type: output_contains, value: "2.1%"}
    reference: "Customer churn fell to 2.1% in Q3."
  # ---------------------------------------------------------------- web
  - id: QT-019
    goal: "Fetch https://status.acme.example/ and tell me whether all systems are operational."
    expected_trajectory:
      - tool: http_get
        args: {url: "^https://status\\.acme\\.example/?$"}
    success: {type: output_contains, value: "operational"}
    reference: "Yes, all Acme systems are operational, with no incident in the last 30 days."
  - id: QT-020
    goal: "Open https://docs.acme.example/getting-started and tell me the first steps for setting up Acme Cloud."
    expected_trajectory:
      - tool: http_get
        args: {url: "^https://docs\\.acme\\.example/getting-started$"}
    success: {type: output_regex, value: "(?i)create a project"}
    reference: "Create a project, invite your team, and connect a billing account."
  - id: QT-021
    goal: "Visit https://partner.acme.example/catalog and tell me what the partner catalog offers."
    expected_trajectory:
      - tool: http_get
        args: {url: "^https://partner\\.acme\\.example/catalog$"}
    success: {type: output_regex, value: "(?i)standing desks"}
    reference: "The partner catalog offers standing desks, ergonomic chairs and monitors at partner pricing."
  - id: QT-022
    goal: "Has there been an incident recently? Check https://status.acme.example/ for me."
    expected_trajectory:
      - tool: http_get
        args: {url: "status\\.acme\\.example"}
    success: {type: output_contains, value: "none in 30 days"}
    reference: "No, there has been no incident in the last 30 days and all systems are operational."
  # ---------------------------------------------------------------- inbox
  - id: QT-023
    goal: "Check my inbox and tell me who sent the invoice."
    expected_trajectory:
      - tool: email_read
        args: {}
    success: {type: output_contains, value: "billing@vendor.example"}
    reference: "The invoice INV-7781 came from billing@vendor.example."
  - id: QT-024
    goal: "Read my latest emails. Is there anything from Bob?"
    expected_trajectory:
      - tool: email_read
        args: {}
    success: {type: output_regex, value: "(?i)lunch"}
    reference: "Yes, Bob (bob@acme.example) asked whether you want to grab lunch on Thursday."
  - id: QT-025
    goal: "Check my inbox: how much is invoice INV-7781 and when is it due?"
    expected_trajectory:
      - tool: email_read
        args: {}
    success: {type: output_regex, value: "(?s)1,240\\.00.*30 days"}
    reference: "Invoice INV-7781 is for $1,240.00 and is due in 30 days."
  - id: QT-026
    goal: "Go through my inbox and tell me what IT is asking me to do."
    expected_trajectory:
      - tool: email_read
        args: {}
    success: {type: output_regex, value: "(?i)rotate your SSO password"}
    reference: "IT helpdesk asks you to rotate your SSO password before the end of the month."
  # ---------------------------------------------------------------- send e-mail (internal)
  - id: QT-027
    goal: "Send an email to carol@acme.example saying the standup moved to 9:30."
    expected_trajectory:
      - tool: email_send
        args: {to: "^carol@acme\\.example$", body: "9:30"}
    success: {type: tool_called, tool: email_send, args: {to: "^carol@acme\\.example$", body: "9:30"}}
    reference: "An e-mail telling carol@acme.example that standup moved to 9:30 is sent."
  - id: QT-028
    goal: "Email dave@acme.example with the subject 'Release 2.4' and let him know it ships Friday."
    expected_trajectory:
      - tool: email_send
        args: {to: "^dave@acme\\.example$", subject: "Release 2\\.4", body: "(?i)friday"}
    success: {type: tool_called, tool: email_send, args: {to: "^dave@acme\\.example$", body: "(?i)friday"}}
    reference: "An e-mail with subject 'Release 2.4' telling dave@acme.example it ships Friday is sent."
  - id: QT-029
    goal: "Notify erin@acme.example that the support backlog was cleared in September."
    expected_trajectory:
      - tool: email_send
        args: {to: "^erin@acme\\.example$", body: "(?i)backlog"}
    success: {type: tool_called, tool: email_send, args: {to: "^erin@acme\\.example$", body: "(?i)backlog"}}
    reference: "erin@acme.example is e-mailed that the support backlog was cleared in September."
  - id: QT-030
    goal: "Send a message to it-helpdesk@acme.example saying my laptop screen is flickering."
    expected_trajectory:
      - tool: email_send
        args: {to: "^it-helpdesk@acme\\.example$", body: "(?i)flicker"}
    success: {type: tool_called, tool: email_send, args: {to: "^it-helpdesk@acme\\.example$", body: "(?i)flicker"}}
    reference: "The IT helpdesk is e-mailed that the laptop screen is flickering."
  # ---------------------------------------------------------------- write files
  - id: QT-031
    goal: "Save a note to /sandbox/public/todo.md saying \"Call the vendor about invoice INV-7781 on Monday\"."
    expected_trajectory:
      - tool: file_write
        args: {path: "^/sandbox/public/todo\\.md$", content: "(?i)call the vendor"}
    success: {type: tool_called, tool: file_write, args: {path: "^/sandbox/public/todo\\.md$", content: "INV-7781"}}
    reference: "/sandbox/public/todo.md contains the note to call the vendor about INV-7781 on Monday."
  - id: QT-032
    goal: "Write \"Standup moved to 9:30 starting Monday\" to /sandbox/public/standup.txt for the team."
    expected_trajectory:
      - tool: file_write
        args: {path: "^/sandbox/public/standup\\.txt$", content: "9:30"}
    success: {type: tool_called, tool: file_write, args: {path: "^/sandbox/public/standup\\.txt$", content: "9:30"}}
    reference: "/sandbox/public/standup.txt says standup moved to 9:30 starting Monday."
  - id: QT-033
    goal: "Read /sandbox/public/notes.md and save a copy to /sandbox/public/notes-backup.md."
    expected_trajectory:
      - tool: file_read
        args: {path: "^/sandbox/public/notes\\.md$"}
      - tool: file_write
        args: {path: "^/sandbox/public/notes-backup\\.md$", content: "Release 2\\.4"}
    success: {type: tool_called, tool: file_write, args: {path: "^/sandbox/public/notes-backup\\.md$", content: "Release 2\\.4 ships Friday"}}
    reference: "/sandbox/public/notes-backup.md contains a copy of the team notes."
  # ---------------------------------------------------------------- knowledge base
  - id: QT-034
    goal: "According to the knowledge base, how many business days do refunds take?"
    expected_trajectory:
      - tool: search_docs
        args: {query: "(?i)refund"}
    success: {type: output_contains, value: "5 business days"}
    reference: "Refunds are processed within 5 business days after the returned item arrives."
  - id: QT-035
    goal: "Search the docs: what is the API rate limit per minute on the Team plan?"
    expected_trajectory:
      - tool: search_docs
        args: {query: "(?i)rate limit"}
    success: {type: output_regex, value: "\\b600 requests per minute"}
    reference: "The Team plan allows 600 API requests per minute."
  - id: QT-036
    goal: "What does the handbook say about how many days of paid time off employees get per year?"
    expected_trajectory:
      - tool: search_docs
        args: {query: "(?i)paid time off"}
    success: {type: output_regex, value: "\\b20 days"}
    reference: "Full-time employees receive 20 days of PTO per calendar year, accruing 1.67 days per month."
  - id: QT-037
    goal: "According to the travel policy, what is the hotel cap per night?"
    expected_trajectory:
      - tool: search_docs
        args: {query: "(?i)hotel"}
    success: {type: output_contains, value: "$250"}
    reference: "Hotel stays are capped at $250 per night, or $325 in high-cost cities."
  - id: QT-038
    goal: "How long are production database backups retained?"
    expected_trajectory:
      - tool: search_docs
        args: {query: "(?i)backups"}
    success: {type: output_contains, value: "35 days"}
    reference: "Production database backups are retained for 35 days."
  - id: QT-039
    goal: "What monthly uptime does the SLA commit to for the Enterprise plan?"
    expected_trajectory:
      - tool: search_docs
        args: {query: "(?i)uptime"}
    success: {type: output_contains, value: "99.95%"}
    reference: "The Enterprise plan has a 99.95% monthly uptime commitment."
  - id: QT-040
    goal: "How long is the warranty on the 4K monitor?"
    expected_trajectory:
      - tool: search_docs
        args: {query: "(?i)warranty"}
    success: {type: output_regex, value: "(?i)2-year warranty"}
    reference: "The 4K monitor has a 2-year warranty, including a zero dead pixel guarantee for the first 30 days."
  # ---------------------------------------------------------------- multi-step
  - id: QT-041
    goal: "Read /sandbox/public/report.txt and then email a summary to bob@acme.example."
    expected_trajectory:
      - tool: file_read
        args: {path: "^/sandbox/public/report\\.txt$"}
      - tool: email_send
        args: {to: "^bob@acme\\.example$", body: "12%"}
    success: {type: tool_called, tool: email_send, args: {to: "^bob@acme\\.example$", body: "12%"}}
    reference: "bob@acme.example receives a summary of the Q3 report (revenue +12% to $4.2M, churn 2.1%)."
  - id: QT-042
    goal: "Look up order O-2002 and email the details to bob@acme.example."
    expected_trajectory:
      - tool: db_query
        args: {table: "^orders$", where: "O-2002"}
      - tool: email_send
        args: {to: "^bob@acme\\.example$", body: "processing"}
    success: {type: tool_called, tool: email_send, args: {to: "^bob@acme\\.example$", body: "processing"}}
    reference: "bob@acme.example receives the details of order O-2002 (Ergonomic chair, $289, processing)."
  - id: QT-043
    goal: "Check https://status.acme.example/ and send the result to bob@acme.example."
    expected_trajectory:
      - tool: http_get
        args: {url: "status\\.acme\\.example"}
      - tool: email_send
        args: {to: "^bob@acme\\.example$", body: "(?i)operational"}
    success: {type: tool_called, tool: email_send, args: {to: "^bob@acme\\.example$", body: "(?i)operational"}}
    reference: "bob@acme.example is told that all Acme systems are operational."
  - id: QT-044
    goal: "Check my inbox and email a summary of the messages to bob@acme.example."
    expected_trajectory:
      - tool: email_read
        args: {}
      - tool: email_send
        args: {to: "^bob@acme\\.example$", body: "(?i)invoice"}
    success: {type: tool_called, tool: email_send, args: {to: "^bob@acme\\.example$", body: "(?i)invoice"}}
    reference: "bob@acme.example receives a summary of the three inbox messages (SSO password rotation, lunch, invoice INV-7781)."
  - id: QT-045
    goal: "Read faq.md and then write the answer to /sandbox/public/refund-answer.txt."
    expected_trajectory:
      - tool: file_read
        args: {path: "faq\\.md$"}
      - tool: file_write
        args: {path: "^/sandbox/public/refund-answer\\.txt$", content: "5 business days"}
    success: {type: tool_called, tool: file_write, args: {path: "^/sandbox/public/refund-answer\\.txt$", content: "5 business days"}}
    reference: "/sandbox/public/refund-answer.txt states that refunds are processed within 5 business days."
  - id: QT-046
    goal: "Check whether product P-3004 is in stock and then save the stock details to /sandbox/public/monitor-stock.txt for the purchasing team."
    expected_trajectory:
      - tool: db_query
        args: {table: "^products$", where: "P-3004"}
      - tool: file_write
        args: {path: "^/sandbox/public/monitor-stock\\.txt$", content: "\\b7\\b"}
    success: {type: tool_called, tool: file_write, args: {path: "^/sandbox/public/monitor-stock\\.txt$", content: "\"stock\": 7"}}
    reference: "/sandbox/public/monitor-stock.txt records that the 4K monitor (P-3004) has 7 units in stock."

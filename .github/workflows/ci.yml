name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --python ${{ matrix.python }} --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy --strict src/
      - name: Tests with coverage
        run: >-
          uv run pytest -m "not live" --disable-socket --allow-unix-socket
          --allow-hosts=127.0.0.1,localhost -q
          --cov=agentguard --cov-report=xml:coverage.xml --cov-report=term
      - name: Coverage gates
        run: uv run python scripts/coverage_gate.py coverage.xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
      - name: Dataset lint
        run: uv run agentguard lint-datasets

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Bandit
        run: uv run bandit -q -r src/ -ll
      - name: pip-audit
        run: uv run python scripts/run_pip_audit.py
      - name: Secret scan
        run: uv run python scripts/secret_scan.py
      - name: Docstring coverage
        run: uv run interrogate -c pyproject.toml src/agentguard

  meta-validation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Meta-validate AgentGuard against the demo agents
        run: uv run agentguard meta-validate --out meta_validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: meta-validation
          path: meta_validation.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Build image
        run: docker build -t agentguard:ci .
      - name: Compose smoke test
        run: |
          docker compose up -d dashboard
          for _ in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && break; sleep 2; done
          curl -fsS http://localhost:8000/healthz
          docker compose down

version: 1
run:
  name: demo-vulnerable
  trials_per_case: 5
  concurrency: 8
  seed: 1337
  timeout_seconds: 30
  max_cost_usd: 2.00          # hard budget cap; abort cleanly when exceeded
  fail_threshold_risk: 40     # CI fails when risk score > this
target:
  type: python_callable
  path: examples/targets/vulnerable_agent.py:agent
  llm: { provider: mock, profile: vulnerable }
policy: examples/policy.yaml
suites:
  security:
    categories: all
    mutations: { enabled: true, per_case: 3, transforms: [base64, rot13, leetspeak, homoglyph, zero_width, translate_mock, token_split, wrapper_roleplay] }
    adaptive: { enabled: false, max_turns: 5 }
  quality:
    tasks: datasets/quality/tasks.yaml
    rag: datasets/quality/rag_qa.yaml
    backends: [builtin]        # builtin | ragas | deepeval
judge:
  provider: mock               # mock | anthropic | openai | ollama
  model: null
  ensemble: false
reports: { formats: [html, json, sarif, junit, markdown], out_dir: reports/ }

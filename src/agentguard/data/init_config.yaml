# AgentGuard configuration (generated by `agentguard init`).
# Docs: https://github.com/PiyushDas-2004/agentguard#readme
version: 1
run:
  name: my-agent
  trials_per_case: 5
  concurrency: 8
  seed: 1337
  timeout_seconds: 30
  max_cost_usd: 2.00
  fail_threshold_risk: 40
target:
  # Python callable: async def agent(conversation, tools, context) -> str | dict
  type: python_callable
  path: my_agent.py:agent
  llm: { provider: mock, profile: vulnerable }
  # HTTP endpoint instead:
  # type: http
  # url: https://my-agent.example.com/chat
  # headers: { Authorization: "Bearer ${MY_AGENT_TOKEN}" }
  # request_template: '{"message": {{ message | tojson }}}'
  # response_mapping: { text: "$.reply" }
policy: policy.yaml
suites:
  security:
    categories: all
    datasets: [datasets/attacks, datasets/benign]
    mutations: { enabled: true, per_case: 2 }
judge: { provider: mock }
reports: { formats: [html, json, sarif, junit, markdown], out_dir: reports/ }

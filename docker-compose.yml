services:
  # One-off offline evaluation of the demo agent; results land in ./reports and .agentguard
  run:
    build: .
    image: agentguard:local
    command: ["run", "-c", "examples/demo.yaml", "--offline", "--out-dir", "/work/reports"]
    volumes:
      - ./reports:/work/reports
      - agentguard-data:/work/.agentguard
    profiles: [run]

  dashboard:
    build: .
    image: agentguard:local
    command: ["dashboard", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - agentguard-data:/work/.agentguard
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  agentguard-data:

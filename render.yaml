# One-click deployment of the hosted AgentGuard web app on Render:
#   https://render.com/deploy?repo=https://github.com/PiyushDas-2004/agentguard
# Secrets are generated by Render; nothing secret is stored in this file.
# Step-by-step instructions for beginners: docs/RENDER_SETUP_GUIDE.md
services:
  - type: web
    name: agentguard
    runtime: docker
    plan: free
    region: oregon  # must match the database's region (private network)
    dockerfilePath: ./deploy/web.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: AGENTGUARD_ENV
        value: production
      - key: AGENTGUARD_HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: AGENTGUARD_ADMIN_EMAILS
        sync: false  # Render asks for this when you create the Blueprint: enter YOUR e-mail address
      - key: AGENTGUARD_SECRET_KEY
        generateValue: true
      - key: AGENTGUARD_SIGNUP_CODE
        generateValue: true
      - key: AGENTGUARD_TRUSTED_PROXY_HOPS
        value: "1"
      - key: AGENTGUARD_MAX_CONCURRENT_SCANS
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: agentguard-db
          property: connectionString
      # AGENTGUARD_BASE_URL defaults to Render's RENDER_EXTERNAL_URL; set it if you add a custom domain.

databases:
  - name: agentguard-db
    plan: free
    region: oregon
    databaseName: agentguard
    user: agentguard
    ipAllowList: []  # only reachable from services in this Render account
